<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Fllip(TM) - Muzik Edition</title>
    <style>
        :root {
            --primary-white: #ffffff;
            --text-gray: #b0b0b0;
            --transition-speed: 0.5s;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            letter-spacing: 0.05rem;
        }

        body {
            background: #000;
            color: var(--primary-white);
            height: 100vh;
            overflow: hidden;
        }

        /* 배경 레이어 */
        #bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            transition: background 1s cubic-bezier(0.4, 0, 0.2, 1), transform 1.2s ease-out;
            background-size: cover; background-position: center; transform: scale(1.05);
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        /* 실행 애니메이션용 화이트 오버레이 */
        #flash-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 100;
            transition: opacity 0.4s ease;
        }

        .ps5-container {
            padding: 60px 100px; height: 100vh; display: flex; flex-direction: column;
            transition: transform 0.8s cubic-bezier(0.7, 0, 0.3, 1), opacity 0.8s, filter 0.8s;
        }

        /* 실행 애니메이션 적용 시 상태 */
        body.launching .ps5-container { transform: scale(2.5); filter: brightness(2) blur(15px); opacity: 0; }
        body.launching #flash-overlay { opacity: 1; }

        header { display: flex; justify-content: space-between; margin-bottom: 50px; text-transform: uppercase; }
        .nav-tabs span { margin-right: 40px; opacity: 0.4; transition: 0.3s; cursor: pointer; }
        .nav-tabs span.active { opacity: 1; border-bottom: 3px solid white; padding-bottom: 5px; }

        .game-list { display: flex; gap: 25px; height: 250px; align-items: center; }
        .game-item {
            width: 140px; height: 200px; border-radius: 15px; overflow: hidden;
            cursor: pointer; transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            border: 4px solid transparent; background: rgba(255,255,255,0.05);
        }
        .game-item img { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; transition: 0.5s; }
        .game-item.selected { transform: scale(1.2) translateY(-15px); border-color: white; z-index: 10; }
        .game-item.selected img { opacity: 1; transform: scale(1.05); }

        .info-panel { margin-top: auto; margin-bottom: 80px; max-width: 800px; }
        .info-panel h1 { font-size: 4rem; font-weight: 800; margin-bottom: 20px; line-height: 1.1; }
        .info-panel p { font-size: 1.3rem; line-height: 1.8; color: #ccc; margin-bottom: 35px; word-break: keep-all; }

        .play-btn {
            padding: 16px 60px; background: white; color: black; border: none;
            border-radius: 40px; font-weight: bold; font-size: 1.2rem; cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .animate-in { animation: fadeInUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

        /* 스플래시 스크린 스타일 */
    #splash-screen {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.5s ease;
    }

    /* 플스 특유의 서서히 밝아지는 로고 연출 */
    .splash-logo {
        font-size: 3rem;
        font-weight: 900;
        letter-spacing: 1rem;
        color: #fff;
        text-shadow: 0 0 20px rgba(255,255,255,0.5);
        animation: logoGlow 2s ease-in-out infinite alternate;
        margin-bottom: 20px;
    }

    .splash-loader {
        width: 50px;
        height: 2px;
        background: rgba(255,255,255,0.2);
        position: relative;
        overflow: hidden;
        margin: 0 auto;
    }

    .splash-loader::after {
        content: '';
        position: absolute;
        left: -100%;
        width: 100%;
        height: 100%;
        background: #fff;
        animation: loading 1.5s infinite;
    }

    @keyframes logoGlow {
        from { opacity: 0.6; transform: scale(0.98); filter: blur(2px); }
        to { opacity: 1; transform: scale(1); filter: blur(0px); }
    }

    @keyframes loading {
        0% { left: -100%; }
        50% { left: 0; }
        100% { left: 100%; }
    }

    /* 배경이 빨려 들어가는 연출 강화 */
    body.launching .ps5-container {
        transform: scale(1.5); /* 너무 과하지 않게 조정 */
        filter: blur(20px) brightness(0);
        opacity: 0;
        transition: all 1.2s cubic-bezier(0.7, 0, 0.3, 1);
    }

    body.launching #splash-screen {
        opacity: 1;
        visibility: visible;
    }
    </style>
</head>
<body>
    <div id="bg-layer"></div>
    <div class="overlay"></div>

    <div class="ps5-container">
        <header>
            <div class="nav-tabs"><span class="active">Muzik</span></div>
            <div id="clock">11:00 PM</div>
        </header>

        <main>
            <div class="game-list" id="game-list">
                <div class="game-item selected" 
                     data-title="홀란드 제로 스탠다드 에디션" 
                     data-desc="Holland(TM)의 스핀오프 시리즈. Holland(TM)를 더 길고 강렬하게 즐겨보세요."
                     data-bg-val="#1a3a6a"
                     data-link="./vods/holland_zero.html">
                    <img src="img/홀란드 제로.png">
                </div>

                <div class="game-item" 
                     data-title="Holland(TM) 극" 
                     data-desc='"L은 영단어 Limit의 약자이며, 이는 극한을 뜻합니다" 2025년 5월 29일 출시한 Holand(TM)의 리메이크 작품. 더 향상된 품질로 Holand(TM)를 즐기세요.'
                     data-bg-val="#2e2b14"
                     data-link="./vods/holland_limit.html">
                    <img src="img/Holland Limit.png">
                </div>
            </div>

            <div class="info-panel" id="info-panel">
                <h1 id="disp-title">제목</h1>
                <p id="disp-desc">설명</p>
                <button class="play-btn" onclick="launchSequence()">재생하기</button>
            </div>
        </main>
    </div>

    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">Fll!P</div>
            <div class="splash-loader"></div>
    </div>

    <script>
        const items = document.querySelectorAll('.game-item');
        const bgLayer = document.getElementById('bg-layer');
        const infoPanel = document.getElementById('info-panel');
        const dispTitle = document.getElementById('disp-title');
        const dispDesc = document.getElementById('disp-desc');

        let currentIndex = 0;

        function updateUI(index) {
            items.forEach(item => item.classList.remove('selected'));
            currentIndex = index;
            const target = items[currentIndex];
            target.classList.add('selected');

            infoPanel.classList.remove('animate-in');
            void infoPanel.offsetWidth; 

            setTimeout(() => {
                dispTitle.innerText = target.getAttribute('data-title');
                dispDesc.innerText = target.getAttribute('data-desc');
                
                const bgVal = target.getAttribute('data-bg-val');
                if (bgVal.startsWith('http') || bgVal.startsWith('img/')) {
                    bgLayer.style.background = `url('${bgVal}') center/cover`;
                } else {
                    bgLayer.style.background = `radial-gradient(circle at 20% 50%, ${bgVal} 0%, #000 100%)`;
                }
                infoPanel.classList.add('animate-in');
            }, 50);
        }

        function launchSequence() {
            const targetLink = items[currentIndex].getAttribute('data-link');
        
            // 1. 홈 UI 축소 및 암전 시작
            document.body.classList.add('launching');
        
            // 2. 충분한 스플래시 노출 후 페이지 이동
            setTimeout(() => {
                window.location.href = targetLink;
                }, 2500); // 2.5초 정도 로고를 보여줌
            }

        items.forEach((item, i) => {
            item.addEventListener('click', () => updateUI(i));
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') updateUI((currentIndex + 1) % items.length);
            else if (e.key === 'ArrowLeft') updateUI((currentIndex - 1 + items.length) % items.length);
            else if (e.key === 'Enter') launchSequence();
        });

        updateUI(0);

        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }, 1000);
    </script>
</body>
</html>
