<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Fllip(TM) Player</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; height: 100vh; }
        .video-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        iframe { width: 100%; height: 100%; border: none; }
        .back-btn {
            position: absolute; top: 40px; left: 40px; background: rgba(255,255,255,0.2);
            color: white; border: none; padding: 12px 24px; border-radius: 30px;
            cursor: pointer; z-index: 100; backdrop-filter: blur(10px); font-weight: bold;
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="history.back()">✕ 돌아가기</button>
    <div class="video-container" id="player"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');
        
        if (videoId) {
            document.getElementById('player').innerHTML = `
                <iframe width="1920" height="1080" src="https://www.youtube.com/embed/${videoId}" title="Fllip" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`
        } else {
            alert("영상을 불러올 수 없습니다.");
            history.back();
        }
    </script>
</body>
</html>
